name: Android build
on:
  pull_request:
    paths: ['android/**', 'Savedd/Proverbs.json', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'Savedd/Proverbs.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build test APK, run unit checks and lint, and check unsigned release bundle
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug bundleRelease --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: Savedd-Android-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-build-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Enable KVM access on the ephemeral runner
        run: |
          printf '%s\n' 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: android
          script: bash ci-device-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-checks
          path: |
            android/app/build/outputs/device-screenshots/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/
