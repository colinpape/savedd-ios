name: iOS build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify directory trust rules and website preference handoff
        working-directory: Tools/partner-directory
        run: npm ci && npm test && npm run build
      - name: Verify bundled directory reader is current
        run: git diff --exit-code -- Savedd/PartnerDirectory.js
      - name: Test address history and search routing
        run: |
          swiftc -parse-as-library Savedd/Models.swift Savedd/SearchEngine.swift Tests/AddressHistoryTests.swift -o "$RUNNER_TEMP/address-history-tests"
          "$RUNNER_TEMP/address-history-tests"
      - name: Build for iOS Simulator without signing
        run: xcodebuild -project Savedd.xcodeproj -scheme Savedd -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Prepare simulator
        timeout-minutes: 8
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          echo "SAVEDD_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          sleep 15
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl install "$DEVICE_ID" DerivedData/Build/Products/Debug-iphonesimulator/Savedd.app
          mkdir -p screenshots
      - name: Reproduce homepage replay and verify real WebKit navigation
        timeout-minutes: 5
        run: |
          APP_DATA=$(xcrun simctl get_app_container "$SAVEDD_SIMULATOR_ID" com.savedd.browser data)
          REPORT="$APP_DATA/Documents/navigation-regression.json"
          for MODE in legacy fixed; do
            rm -f "$REPORT"
            if [ "$MODE" = legacy ]; then
              xcrun simctl launch "$SAVEDD_SIMULATOR_ID" com.savedd.browser --navigation-regression --simulate-legacy-url-sync
            else
              xcrun simctl launch "$SAVEDD_SIMULATOR_ID" com.savedd.browser --navigation-regression
            fi
            for ATTEMPT in $(seq 1 100); do
              if [ -f "$REPORT" ]; then break; fi
              sleep 1
            done
            cp "$REPORT" "screenshots/navigation-$MODE.json"
            xcrun simctl terminate "$SAVEDD_SIMULATOR_ID" com.savedd.browser
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          legacy = json.loads(Path('screenshots/navigation-legacy.json').read_text())
          fixed = json.loads(Path('screenshots/navigation-fixed.json').read_text())
          assert not legacy['passed'] and 'homepage' in legacy['error'], legacy
          assert any('q=coffee' in url for url in legacy['backHistory']), legacy
          assert fixed['passed'], fixed
          print("Reproduced the old extra-homepage navigation; fixed WebKit flow passed:", fixed['stages'])
          PY
      - name: Capture first-run screens
        timeout-minutes: 12
        run: |
          DEVICE_ID="$SAVEDD_SIMULATOR_ID"
          collect_diagnostics() {
            xcrun simctl spawn "$DEVICE_ID" log show --last 4m --style compact --predicate 'process == "Savedd"' > screenshots/app.log 2>&1 || true
            find "$HOME/Library/Logs/DiagnosticReports" -type f -name 'Savedd*' -exec cp {} screenshots/ \; || true
          }
          trap collect_diagnostics EXIT
          for STEP in 0 1 2 3; do
            CAPTURED=false
            for ATTEMPT in 1 2; do
              if xcrun simctl launch "$DEVICE_ID" com.savedd.browser --onboarding-preview-step "$STEP"; then
                sleep 20
                xcrun simctl io "$DEVICE_ID" screenshot "screenshots/step-$STEP.png"
                if xcrun simctl terminate "$DEVICE_ID" com.savedd.browser; then
                  CAPTURED=true
                  break
                fi
              fi
              collect_diagnostics
              sleep 10
            done
            test "$CAPTURED" = true
          done
          xcrun simctl launch "$DEVICE_ID" com.savedd.browser --visual-tabs-preview
          sleep 14
          xcrun simctl io "$DEVICE_ID" screenshot screenshots/browser-voice-button.png
          sleep 31
          xcrun simctl io "$DEVICE_ID" screenshot screenshots/visual-tabs.png
          xcrun simctl terminate "$DEVICE_ID" com.savedd.browser
          xcrun simctl launch "$DEVICE_ID" com.savedd.browser --address-editor-preview
          sleep 15
          xcrun simctl io "$DEVICE_ID" screenshot screenshots/keyboard-address-history.png
          xcrun simctl terminate "$DEVICE_ID" com.savedd.browser
          xcrun simctl launch "$DEVICE_ID" com.savedd.browser --share-menu-preview
          sleep 45
          xcrun simctl io "$DEVICE_ID" screenshot screenshots/share-bookmark-action.png
          xcrun simctl terminate "$DEVICE_ID" com.savedd.browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-screens-${{ matrix.runner }}
          path: screenshots/
